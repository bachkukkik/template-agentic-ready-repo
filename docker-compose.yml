# Docker Compose — Agentic Ready Repo Template
services:
  # ─── Python microservice ────────────────────────────────────
  service:
    build: ./service
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
