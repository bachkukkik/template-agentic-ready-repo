# Dependabot config (AC-QC-006). The three ecosystems this repo actually uses:
# github-actions keeps the SHA pins current (AC-QC-002's standing counterweight),
# pip covers the test-only requirements, docker covers the service image + base.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /service
    schedule:
      interval: weekly
